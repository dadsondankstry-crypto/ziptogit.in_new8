plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ninekingdom.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ninekingdom.mobile'
        minSdk 23
        targetSdk 36
        versionCode 80
        versionName '8.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
